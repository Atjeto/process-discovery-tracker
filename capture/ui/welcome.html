<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; font-src data:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Welcome</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14141A; --bg-2: #22222A; --bg-3: #2E2E37; --border: #424250;
    --fg: #D8D6CE; --fg-2: #A8A69E; --fg-3: #8E8C82;
    --accent: #6E8A66; --accent-hi: #8AAB7E; --on-accent: #11140F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 28px 22px; background: var(--bg); color: var(--fg);
         font-family: var(--font-ui); font-size: 13px; line-height: 1.55; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 14px; }
  ol { margin: 0; padding-left: 20px; color: var(--fg-2); }
  li { margin-bottom: 8px; }
  li::marker { color: var(--fg-3); }
  kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px;
        background: var(--bg-3); border: 1px solid var(--border); border-radius: 3px; color: var(--fg); }
  strong { color: var(--fg); font-weight: 600; }
  .row { display: flex; gap: 10px; margin-top: 20px; }
  .row button { padding: 9px 16px; border: 1px solid var(--border);
                background: var(--bg-2); color: var(--fg-2); border-radius: 5px;
                font-family: inherit; font-size: 13px; cursor: pointer; }
  .row button:hover { background: var(--bg-3); color: var(--fg); }
  .row button.primary { background: var(--accent); color: var(--on-accent);
                        border-color: var(--accent); font-weight: 600; }
  .row button.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
  .row .spacer { flex: 1; }
  /* Lane C (audit A12, A15): one focus mark on every control. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style></head><body>
<h1>Welcome to Process Discovery Tracker</h1>
<ol>
  <li>{{LINE_START}}</li>
  <li>{{LINE_NEXT}}</li>
  <li>When you are done, click <strong>Stop</strong> on the recording bar. The summary shows where the recording is saved.</li>
</ol>
<div class="row">
  <button id="btn-start" class="primary">Start recording</button>
  <button id="btn-help">Help</button>
  <span class="spacer"></span>
  <button id="btn-close">Close</button>
</div>
<script>
  const { ipcRenderer } = require("electron");
  document.getElementById("btn-start").addEventListener("click", async () => {
    await ipcRenderer.invoke("pdt:welcomeAction", "start");
    window.close();
  });
  document.getElementById("btn-help").addEventListener("click", () => {
    ipcRenderer.invoke("pdt:welcomeAction", "help");
  });
  document.getElementById("btn-close").addEventListener("click", () => window.close());
</script>
</body></html>
