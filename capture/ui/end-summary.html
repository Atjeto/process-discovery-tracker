<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; font-src data:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Recording saved</title>
<style>
  :root {
    color-scheme: dark;
    --bg:        #14141A;
    --bg-2:      #22222A;
    --bg-3:      #2E2E37;
    --bg-hover:  #3A3A44;
    --border:    #424250;
    --field-border: #707080; /* lane A-1: a text field's edge, 3.77:1 on --bg, 3.25:1 on --bg-2 (--border is 1.86:1) */
    --fg:        #D8D6CE;
    --fg-2:      #A8A69E;
    --fg-3:      #8E8C82;
    --accent:    #6E8A66;
    --accent-hi: #8AAB7E;
    --on-accent: #11140F;
    --warn:      #A08050;
    --warn-fg:   #D9B77A;
    --bad-fg:    #E39A9A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-ui); font-size: 13px; line-height: 1.5;
  }
  body { padding: 20px 22px 18px; display: flex; flex-direction: column; gap: 12px; }
  [hidden] { display: none !important; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .headline { margin-top: -8px; color: var(--fg-2); }
  .warning {
    padding: 9px 12px; border-radius: 5px;
    border: 1px solid var(--warn); background: rgba(160, 128, 80, 0.12);
    color: var(--warn-fg); font-size: 12px;
  }
  .lbl { display: block; margin-bottom: -7px; font-size: 11px; color: var(--fg-3); letter-spacing: 0.3px; }
  .folder {
    padding: 8px 10px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg-2);
    font-family: var(--font-mono); font-size: 11px; color: var(--fg);
    word-break: break-all; user-select: text; -webkit-user-select: text;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    padding: 8px 14px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg-3); color: var(--fg);
    font-family: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--bg-hover); }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-hi); border-color: var(--accent-hi); }
  .note { margin-top: -4px; font-size: 12px; color: var(--fg-2); }
  .note.ok { color: var(--fg); }
  .note.bad { color: var(--bad-fg); }
  input {
    width: 100%; padding: 8px 10px; border-radius: 4px;
    border: 1px solid var(--field-border); background: var(--bg-2); color: var(--fg);
    font-family: inherit; font-size: 13px;
  }
  input:focus { border-color: var(--accent); }
  /* Lane C (audit A12, A15): one focus mark on every control. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Lane C (C24): the four questions and the example files, before the zip. */
  .ask {
    display: flex; flex-direction: column; gap: 8px; padding: 12px;
    border-radius: 6px; border: 1px solid var(--border); background: #1B1B22;
  }
  h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .q { display: flex; flex-direction: column; gap: 4px; }
  .q label { font-size: 12px; color: var(--fg-2); }
  .q input { padding: 7px 10px; }
  .files { display: flex; flex-direction: column; gap: 6px; }
  .files-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .files-head h2 { font-size: 12px; font-weight: 400; color: var(--fg-2); }
  .files-head button { padding: 6px 12px; flex: 0 0 auto; }
  .file-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .file-list li {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 6px 4px 10px; border-radius: 4px; background: var(--bg-2);
  }
  .file-list .fname { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  button.link {
    flex: 0 0 auto; min-height: 24px; padding: 2px 8px; border: 0; background: transparent;
    color: var(--accent-hi); text-decoration: underline;
  }
  button.link:hover:not(:disabled) { background: var(--bg-3); }
  .files .note { margin-top: 0; }
  body { min-height: 100vh; }
  .footer { display: flex; justify-content: flex-end; margin-top: auto; }
</style></head><body>

<h1>Recording saved</h1>
<div class="headline" id="headline"></div>
<div class="warning" id="warning" hidden></div>

<!-- Lane FX3 (validation pass 3, F18): the name comes before the zip, so a
     name typed here is in the zip the analyst gets. -->
<label class="lbl" for="name">Name this recording (optional)</label>
<input id="name" placeholder="e.g. Order entry with Sam" autocomplete="off" />

<!-- Lane C (contract C24): what only the SME knows, asked once the work is
     fresh, and the files the work uses; saved on the manifest and in
     attachments/ before the zip, so they travel in it. All optional. -->
<section class="ask" aria-labelledby="ask-title">
  <h2 id="ask-title">For the analyst (optional, one line each)</h2>
  <div class="q">
    <label for="q-trigger">What starts this work?</label>
    <input id="q-trigger" data-key="trigger" maxlength="300" autocomplete="off" />
  </div>
  <div class="q">
    <label for="q-result">What do you have when it is done?</label>
    <input id="q-result" data-key="result" maxlength="300" autocomplete="off" />
  </div>
  <div class="q">
    <label for="q-effort">How often do you do it, and how long does one take?</label>
    <input id="q-effort" data-key="effort" maxlength="300" autocomplete="off" placeholder="For example: about 40 a day, 5 minutes each" />
  </div>
  <div class="q">
    <label for="q-exceptions">What goes differently sometimes, and what do you do then?</label>
    <input id="q-exceptions" data-key="exceptions" maxlength="300" autocomplete="off" />
  </div>
</section>

<section class="files" aria-labelledby="files-title">
  <div class="files-head">
    <h2 id="files-title">Example files (an e-mail, a sheet, a form)</h2>
    <button id="btn-add-file" title="Copies a file into the recording, for the analyst.">Add an example file...</button>
  </div>
  <ul class="file-list" id="file-list" aria-labelledby="files-title" hidden></ul>
  <div class="note bad" id="files-error" role="alert" hidden></div>
</section>

<div class="lbl">Saved in this folder</div>
<div class="folder" id="folder"></div>
<div class="actions">
  <button class="primary" id="btn-zip">Make a zip for the analyst</button>
  <button id="btn-show">Show the folder</button>
</div>
<div class="note" id="note">The zip holds the recording, your answers and the example files. It is saved next to the folder, for you to send to the analyst. Nothing is sent from here.</div>

<div class="footer"><button id="btn-done">Done</button></div>

<script>
const { ipcRenderer } = require("electron");
// The summary model from main.js (capture-guidance.summaryModel).
const S = {{SUMMARY}};
const $ = (id) => document.getElementById(id);

$("headline").textContent = S.headline || "";
if (S.warning) {
  $("warning").textContent = S.warning;
  $("warning").hidden = false;
}
$("folder").textContent = S.folder || "";

// The optional name goes on the recording's manifest (the analyst sees it
// in the viewer): saved on leaving the field, before a zip, and on Done.
let savedName = "";
function saveName() {
  const v = $("name").value.trim();
  if (v === savedName) return Promise.resolve();
  savedName = v;
  return ipcRenderer.invoke("pdt:setSessionLabel", S.folder, v).catch(() => {});
}
$("name").addEventListener("blur", saveName);

// Lane C (contract C24): the four answers go on the manifest as
// sme_answers, saved as the name is: on leaving a field, before a zip, on
// Done. Main trims them, drops the empty ones and caps each at 300.
const questions = Array.from(document.querySelectorAll("input[data-key]"));
let savedAnswers = "{}";
function saveAnswers() {
  const answers = {};
  for (const q of questions) {
    const v = q.value.trim();
    if (v) answers[q.dataset.key] = v;
  }
  const sent = JSON.stringify(answers);
  if (sent === savedAnswers) return Promise.resolve();
  savedAnswers = sent;
  return ipcRenderer.invoke("pdt:setSmeAnswers", S.folder, answers).catch(() => {});
}
for (const q of questions) q.addEventListener("blur", saveAnswers);

// The example files: main opens the file dialog, copies each picked file
// into the recording's attachments/ and lists it in sme_files. The page
// names only an entry of that list, to take out.
function showFiles(files) {
  const list = $("file-list");
  list.textContent = "";
  for (const f of files || []) {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.className = "fname";
    name.textContent = f.file;
    const remove = document.createElement("button");
    remove.className = "link";
    remove.textContent = "Remove";
    remove.title = "Takes this file out of the recording.";
    remove.setAttribute("aria-label", "Remove " + f.file);
    remove.dataset.file = f.file;
    remove.addEventListener("click", () => removeFile(f.file));
    li.append(name, remove);
    list.appendChild(li);
  }
  list.hidden = list.children.length === 0;
}
function showFilesError(lines) {
  const box = $("files-error");
  box.textContent = (lines || []).join(" ");
  box.hidden = !box.textContent;
}
let busy = false;
function setBusy(on) {
  busy = on;
  for (const id of ["btn-add-file", "btn-zip"]) $(id).disabled = on;
  for (const b of document.querySelectorAll("#file-list button")) b.disabled = on;
}
$("btn-add-file").addEventListener("click", async () => {
  if (busy) return;
  setBusy(true);
  try {
    const r = await ipcRenderer.invoke("pdt:addSmeFiles", S.folder);
    if (r) showFiles(r.files);
    showFilesError(r ? r.refused : ["The files could not be added."]);
  } catch (_e) {
    showFilesError(["The files could not be added."]);
  } finally {
    setBusy(false);
    $("btn-add-file").focus();
  }
});
async function removeFile(file) {
  if (busy) return;
  const rows = Array.from(document.querySelectorAll("#file-list button"));
  const at = rows.findIndex((b) => b.dataset.file === file);
  setBusy(true);
  try {
    const r = await ipcRenderer.invoke("pdt:removeSmeFile", S.folder, file);
    if (r) showFiles(r.files);
    showFilesError(r && r.ok ? [] : ['"' + file + '" could not be taken out.']);
  } catch (_e) {
    showFilesError(['"' + file + '" could not be taken out.']);
  } finally {
    setBusy(false);
  }
  // The focus stays in the list: the next file's Remove, else Add.
  const left = Array.from(document.querySelectorAll("#file-list button"));
  (left[Math.min(at, left.length - 1)] || $("btn-add-file")).focus();
}

$("btn-show").addEventListener("click", () => { ipcRenderer.invoke("pdt:showFolder", S.folder); });

$("btn-zip").addEventListener("click", async () => {
  const btn = $("btn-zip");
  const note = $("note");
  if (busy) return;
  setBusy(true);
  note.className = "note";
  note.textContent = "Making the zip...";
  try {
    await saveAnswers();
    await saveName();
    const r = await ipcRenderer.invoke("pdt:zipFolder", S.folder);
    if (r && r.ok) {
      note.className = "note ok";
      note.textContent = "Zip saved: " + r.zipName + " (" + r.size + "). " +
        "It is selected in the folder window; send it to the analyst.";
    } else {
      note.className = "note bad";
      note.textContent = "Could not make the zip. " + ((r && r.error) || "") +
        " Use Show the folder and copy the folder instead.";
    }
  } finally {
    setBusy(false);
    btn.focus();
  }
});

$("btn-done").addEventListener("click", async () => {
  await saveAnswers();
  await saveName();
  window.close();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") saveAnswers().then(saveName).then(() => window.close());
});
</script>
</body></html>
