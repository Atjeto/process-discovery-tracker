# Per-session config for the Process Discovery Tracker.
# Copy to a known location and set PDT_CONFIG=path/to/this.yaml before launch.
# Anything omitted falls back to defaults in config.js.

engagement_id: "demo-2026-05"
engagement_name: "Demo engagement"

worker:
  id: "rasha"
  bu: "Operations"
  role: "SME"

# Session lifecycle
auto_end_idle_minutes: 30
poll_interval_seconds: 5
idle_threshold_seconds: 60

# Named transactions ("task shortcuts") offered on the recording bar (the
# caret next to Next transaction) and in the tray's "Start a named
# transaction" submenu. Set per project. Leave empty and the transaction key
# labels them "Transaction 1", "Transaction 2", ...
process_labels: []

# OBS integration. Set required: true in production so a session fails
# fast if OBS isn't reachable. Leave false during local development.
obs:
  required: false
  websocket_url: "ws://127.0.0.1:4455"
  websocket_password: null
  scene_name: "Process Discovery -- Default"
  auto_create_scene: true

# Global hotkeys (Electron Accelerator syntax)
hotkeys:
  start_picker: "Control+Shift+S"
  end_innermost: "Control+Shift+E"
  manual_screenshot: "Control+Shift+P"

# Taxonomy version this session was captured against. Stamped into
# manifest.json so re-normalization can reproduce or upgrade results.
taxonomy_version: "v0"

# Event-triggered screenshot capture (§3.4)
screenshots:
  enabled: true
  quality: 60                 # JPEG quality 1-100
  on_app_switch: true
  on_marker_fire: true
  on_idle_resume_minutes: 5   # minimum idle duration before resume triggers a screenshot
  # Multi-monitor screen selection:
  #   active  -- capture the display containing the focused window (default)
  #   primary -- always capture the primary display
  #   all     -- capture every connected display
  display: active

# Interaction recording (UIA event subscription via C# sidecar)
interactions:
  enabled: true
  required: false
  auto_restart: true
  max_restarts_per_session: 3
  exclude_processes: []
  # Forensic mode: emit the raw UIA firehose (focus_changed,
  # text_changed, per-keystroke value_changed). Default false. Turn on
  # only when you need to debug missing events or focus tracking.
  # Expect ~3-5x more events per session.
  verbose: false
