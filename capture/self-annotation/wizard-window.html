<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none';" />
<title>Wrap up your session</title>
<style>
  :root {
    --bg: #fafaf7; --fg: #1a1a1a; --fg-2: #4a4a4a; --fg-3: #7a7a7a;
    --accent: #b88332; --rule: #d8d3c7; --bg-1: #f3eee2;
  }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    padding: 24px 32px 12px;
    border-bottom: 1px solid var(--rule);
  }
  header h1 { margin: 0 0 6px 0; font-size: 18px; }
  header p { margin: 0; color: var(--fg-3); font-size: 13px; }
  main {
    flex: 1; padding: 24px 32px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .progress {
    font-size: 12px; color: var(--fg-3); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .question {
    font-size: 16px; color: var(--fg); margin-bottom: 14px;
    line-height: 1.4;
  }
  textarea {
    width: 100%; min-height: 60px; padding: 10px;
    font: inherit;
    border: 1px solid var(--rule); border-radius: 6px;
    background: var(--bg-1);
    box-sizing: border-box; resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .exception {
    margin-top: 10px;
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--fg-2);
  }
  footer {
    padding: 16px 32px;
    border-top: 1px solid var(--rule);
    display: flex; justify-content: space-between; gap: 12px;
  }
  button {
    padding: 8px 16px;
    border: 1px solid var(--rule);
    background: var(--bg-1); color: var(--fg);
    border-radius: 5px;
    cursor: pointer;
    font: inherit;
  }
  button:hover { background: var(--rule); }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.primary:hover { background: #a06f23; }
  .empty {
    padding: 80px 32px; text-align: center; color: var(--fg-3);
  }
  .empty h2 { font-size: 18px; color: var(--fg-2); margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1>Wrap up your session</h1>
  <p id="subtitle">A few quick questions, then you're done.</p>
</header>
<main id="main">
  <div id="empty" class="empty" style="display:none">
    <h2>Nothing to ask</h2>
    <p>We saw enough structure in your session to label everything ourselves. You're done.</p>
  </div>
  <div id="qbody"></div>
</main>
<footer>
  <button id="btn-skip" type="button">Skip remaining</button>
  <div>
    <button id="btn-prev" type="button">← Back</button>
    <button id="btn-next" type="button" class="primary">Next →</button>
  </div>
</footer>

<script>
  "use strict";
  const { ipcRenderer } = require("electron");

  const state = { qs: [], idx: 0, answers: [] };

  async function init() {
    const payload = await ipcRenderer.invoke("pdt-wizard:load");
    state.qs = (payload && payload.questions) || [];
    if (state.qs.length === 0) {
      document.getElementById("empty").style.display = "block";
      document.getElementById("qbody").style.display = "none";
      document.getElementById("btn-next").textContent = "Close";
      document.getElementById("btn-prev").style.display = "none";
      return;
    }
    document.getElementById("subtitle").textContent =
      state.qs.length + " questions, ~30s each. Skip any that don't apply.";
    render();
  }

  function render() {
    const body = document.getElementById("qbody");
    body.innerHTML = "";
    const q = state.qs[state.idx];
    if (!q) return;
    const prog = document.createElement("div");
    prog.className = "progress";
    prog.textContent = (state.idx + 1) + " of " + state.qs.length;
    body.appendChild(prog);
    const qDiv = document.createElement("div");
    qDiv.className = "question";
    qDiv.textContent = q.question;
    body.appendChild(qDiv);
    const ta = document.createElement("textarea");
    ta.placeholder = "Optional — type or skip.";
    ta.value = (state.answers[state.idx] && state.answers[state.idx].answer) || "";
    ta.addEventListener("input", () => {
      state.answers[state.idx] = state.answers[state.idx] || {};
      state.answers[state.idx].answer = ta.value;
    });
    body.appendChild(ta);
    const exDiv = document.createElement("label");
    exDiv.className = "exception";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!(state.answers[state.idx] && state.answers[state.idx].is_exception);
    cb.addEventListener("change", () => {
      state.answers[state.idx] = state.answers[state.idx] || {};
      state.answers[state.idx].is_exception = cb.checked;
    });
    exDiv.appendChild(cb);
    const txt = document.createTextNode(" This was an exception or rework, not the normal flow.");
    exDiv.appendChild(txt);
    body.appendChild(exDiv);
    document.getElementById("btn-prev").disabled = state.idx === 0;
    document.getElementById("btn-next").textContent =
      state.idx === state.qs.length - 1 ? "Submit & close" : "Next →";
  }

  document.getElementById("btn-next").addEventListener("click", async () => {
    if (state.qs.length === 0) {
      window.close();
      return;
    }
    if (state.idx < state.qs.length - 1) {
      state.idx++;
      render();
    } else {
      await submit();
    }
  });
  document.getElementById("btn-prev").addEventListener("click", () => {
    if (state.idx > 0) { state.idx--; render(); }
  });
  document.getElementById("btn-skip").addEventListener("click", async () => {
    await submit();
  });

  async function submit() {
    const out = [];
    state.qs.forEach((q, i) => {
      const a = state.answers[i] || {};
      const txt = (a.answer || "").trim();
      if (!txt && !a.is_exception) return;   // empty + not flagged = skip
      out.push({ question: q, answer: txt, is_exception: !!a.is_exception });
    });
    await ipcRenderer.invoke("pdt-wizard:submit", out);
    window.close();
  }

  init().catch(e => console.error(e));
</script>
</body>
</html>
