name: e2e (all smokes)

# Wave 0 / F1: the in-repo Playwright merge gate. Successor to the out-of-repo
# _pdt_verify harness. It launches the REAL viewer Electron app pre-loaded with
# the committed demo session and ASSERTS through every smoke that e2e/run-all.js
# runs, exiting non-zero on any regression. Unlike js.yml this job must NOT set
# ELECTRON_SKIP_BINARY_DOWNLOAD — it needs the real Electron binary to launch.
# Once stable, this job is allowed to be marked a required status check.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The smokes re-normalize the demo to current pipeline output; that needs
      # the pipeline deps on PATH `python`.
      - name: Install pipeline deps
        run: pip install -r normalization/requirements.txt

      # Install the viewer with the real Electron binary (no SKIP flag) — the
      # e2e driver reuses viewer/node_modules/electron to launch the app.
      - name: Install viewer (with Electron binary)
        working-directory: viewer
        run: npm ci

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Run all smokes
        working-directory: e2e
        run: npm test
        env:
          PDT_E2E_STALL_DIR: ${{ runner.temp }}
      - name: Keep the desktop of a stalled smoke
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stall-desktop
          path: ${{ runner.temp }}/pdt-stall-desktop.png
          if-no-files-found: ignore
