# ServiceNow — Submit Catalog Request (Process Template, §11d).
#
# Canonical process keyed to REAL signatures probed live from a ServiceNow PDI
# Service-Catalog item order form on 2026-05-31 (docs/REAL-VALUE-TESTING.md),
# doc-grounded against request fulfilment (Order Now / Add to Cart creates a REQ
# holding RITM; work runs at the Catalog Task level). Pairs with the catalog-item
# screen in servicenow.yaml. Pass to normalize with
#   --canonical normalization/process_templates/servicenow-catalog-request.yaml
#
# DELIBERATELY NO case_anchor: a catalog order form has no stable text field to
# anchor on (the item's variables are per-item, with volatile IO:<sys_id> aids,
# and the item name lives in the window title, not a field). Each "Order Now" is
# the natural case boundary; case splitting falls back to the session's marker /
# anchor mode. Only the GENERIC, item-independent controls are templated here —
# Quantity, Add to Cart, Order Now (stable aids on every catalog item).
canonical_process:
  id: "servicenow-catalog-request"
  name: "ServiceNow — Submit Catalog Request"
  version: 1
  owners: ["pdt"]

  phases:
    - phase_id: "configure"
      name: "Configure item"
      step_ids: ["set-quantity"]
    - phase_id: "order"
      name: "Order"
      step_ids: ["add-to-cart", "order-now"]

  steps:
    - step_id: "set-quantity"
      name: "Set quantity"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "ComboBox", automation_id: "quantity" }
    - step_id: "add-to-cart"
      name: "Add to cart"
      boundary: "single"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "Button", automation_id: "oi_add_to_cart_button" }
    - step_id: "order-now"
      name: "Order now"
      boundary: "single"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "Button", automation_id: "oi_order_now_button" }
