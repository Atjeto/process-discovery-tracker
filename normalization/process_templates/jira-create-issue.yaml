# Jira — Create Issue (Process Template, §11d).
#
# ⚠️ DRAFT — DOC-DERIVED SKELETON, NOT LIVE-PROBED. Pairs with the DRAFT
# jira.yaml App Vocabulary; the step `match` blocks key on the SAME provisional
# label-based signatures (control_type + visible field label). The Jira create
# form was not reachable for a live UIA probe when this was authored — the field
# set comes from Atlassian docs (Global Issue Create), not a UIA walk. Confirm
# every signature with the 2-minute probe in
# docs/To-Do/JIRA-ZENDESK-PROBE-CHEATSHEET.md before relying on this template.
#
# Pass to normalize with
#   --canonical normalization/process_templates/jira-create-issue.yaml
# Scope is by window_title_regex (".*Jira.*") not process_name so it works in
# Chrome or Edge. Each issue created is one case, anchored on the Summary typed.
# PROBE: the anchor assumes the Summary field's accessible name is "Summary".
canonical_process:
  id: "jira-create-issue"
  name: "Jira — Create Issue (DRAFT doc-derived)"
  version: 1
  owners: ["pdt"]

  case_anchor:
    field: "name"
    equals: "Summary"
    case_label_from: "value"
    min_case_interactions: 2
    min_case_duration_ms: 1000

  phases:
    - phase_id: "select"
      name: "Select project & type"
      step_ids: ["select-project", "set-issue-type"]
    - phase_id: "describe"
      name: "Describe"
      step_ids: ["enter-summary", "enter-description"]
    - phase_id: "classify"
      name: "Classify & assign"
      step_ids: ["set-priority", "set-assignee", "set-labels"]
    - phase_id: "create"
      name: "Create"
      step_ids: ["create"]

  steps:
    - step_id: "select-project"
      name: "Select project"
      match:
        - window_title_regex: ".*Jira.*"
          interaction: { control_type: "ComboBox", name: "Project" }
    - step_id: "set-issue-type"
      name: "Set issue type"
      match:
        - window_title_regex: ".*Jira.*"
          interaction: { control_type: "ComboBox", name: "Issue type" }
    - step_id: "enter-summary"
      name: "Enter summary"
      match:
        - window_title_regex: ".*Jira.*"
          interaction: { control_type: "Edit", name: "Summary" }
    - step_id: "enter-description"
      name: "Enter description"
      match:
        - window_title_regex: ".*Jira.*"
          interaction: { control_type: "Edit", name: "Description" }
    - step_id: "set-priority"
      name: "Set priority"
      match:
        - window_title_regex: ".*Jira.*"
          interaction: { control_type: "ComboBox", name: "Priority" }
    - step_id: "set-assignee"
      name: "Set assignee"
      match:
        - window_title_regex: ".*Jira.*"
          interaction: { control_type: "ComboBox", name: "Assignee" }
    - step_id: "set-labels"
      name: "Set labels"
      match:
        - window_title_regex: ".*Jira.*"
          interaction: { control_type: "ComboBox", name: "Labels" }
    - step_id: "create"
      name: "Create issue"
      boundary: "single"
      match:
        - window_title_regex: ".*Jira.*"
          interaction: { control_type: "Button", name: "Create" }
