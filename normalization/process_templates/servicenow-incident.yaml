# ServiceNow — Create & Resolve Incident (Process Template, §11d).
#
# Canonical process keyed to REAL signatures probed live from a ServiceNow PDI
# incident form (/incident.do) on 2026-05-30 (docs/REAL-VALUE-TESTING.md). Pass it
# to normalize with --canonical normalization/process_templates/servicenow-incident.yaml
# Pairs with the servicenow.yaml App Vocabulary (which names the same controls).
#
# Scope is by window_title_regex (".*ServiceNow.*") rather than process_name so it
# works whether the worker uses Chrome or Edge. Each incident the worker creates is
# one case, anchored on the Short description they type.
canonical_process:
  id: "servicenow-incident"
  name: "ServiceNow — Create & Resolve Incident"
  version: 1
  owners: ["pdt"]

  case_anchor:
    field: "automation_id"
    equals: "incident.short_description"
    case_label_from: "value"
    min_case_interactions: 2
    min_case_duration_ms: 1000

  phases:
    - phase_id: "capture"
      name: "Capture incident"
      step_ids: ["enter-caller", "set-category", "enter-short-description", "enter-description"]
    - phase_id: "triage"
      name: "Triage"
      step_ids: ["set-impact", "set-urgency", "assign"]
    - phase_id: "resolve"
      name: "Submit / Resolve"
      step_ids: ["submit", "resolve"]

  steps:
    - step_id: "enter-caller"
      name: "Enter caller"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "Edit", automation_id: "sys_display.incident.caller_id" }
    - step_id: "set-category"
      name: "Set category"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "ComboBox", automation_id: "incident.category" }
    - step_id: "enter-short-description"
      name: "Enter short description"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "Edit", automation_id: "incident.short_description" }
    - step_id: "enter-description"
      name: "Enter description"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "Edit", automation_id: "incident.description" }
    - step_id: "set-impact"
      name: "Set impact"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "ComboBox", automation_id: "incident.impact" }
    - step_id: "set-urgency"
      name: "Set urgency"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "ComboBox", automation_id: "incident.urgency" }
    - step_id: "assign"
      name: "Assign"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "Edit", automation_id: "sys_display.incident.assignment_group" }
    - step_id: "submit"
      name: "Submit incident"
      boundary: "single"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "Button", automation_id: { starts_with: "sysverb_insert" } }
    - step_id: "resolve"
      name: "Resolve incident"
      boundary: "single"
      match:
        - window_title_regex: ".*ServiceNow.*"
          interaction: { control_type: "Button", automation_id: { starts_with: "resolve_incident" } }
