# ServiceNow (ITSM) App Vocabulary — ADR-0002.
#
# REAL-VALUE mapping (§11d). Incident form probed live from a ServiceNow PDI on
# 2026-05-30; Change Request, Service-Catalog item order form, the Request (REQ)
# record, and the generic platform layer probed live on 2026-05-31 (see
# docs/REAL-VALUE-TESTING.md), each cross-checked against ServiceNow docs for the
# FUNCTION of every control.
#
# SIGNATURE STRATEGY — ServiceNow classic forms expose STABLE element ids as the
# automation_id (<table>.<field>; sys_display.<table>.<ref> for reference fields;
# sysverb_* for the generic record verbs), so those are keyed on automation_id.
# Where probing showed a NAME is state-dependent (e.g. a change field reads
# "Read only - cannot be modified <Label>" until the change Type is set), the aid
# wins. Per-instance / per-item ids are VOLATILE and are skipped or keyed on the
# generic accessible NAME instead: list-action aids embed the table
# (`<table>_control_button`, `_filter_toggle_image`), catalog-item variables use
# `IO:<sys_id>`, item links use `item_link_<sys_id>`, and the top-nav menu aids are
# sys_id hashes — so list/nav controls key on their generic NAME.
#
# FUNCTIONAL NOTES grounded in ServiceNow docs:
#   - Incident: Impact x Urgency = Priority, and Priority is READ-ONLY / auto-
#     calculated — the analyst sets Impact + Urgency (inputs), not Priority. Work
#     notes are internal; Additional comments are customer-visible. States
#     New -> In Progress -> On Hold -> Resolved -> Closed.
#   - Change: Type is Standard (pre-authorized / low-risk), Normal (CAB review), or
#     Emergency (bypass -> Authorize / CAB). The Planning fields (Justification,
#     Implementation / Backout / Test plan, Risk & impact analysis) are read-only
#     until Type / Model is set. Lifecycle New->Assess->Authorize->Scheduled->
#     Implement->Review.
#   - Catalog / Request: an Order Now or Add to Cart on a catalog item creates a
#     REQ (sc_request) holding one or more RITM (sc_req_item); fulfilment work runs
#     at the Catalog Task level. request_state / approval track the lifecycle.
#
# SCOPE NOTE: the standalone catalog BROWSE page titles itself just "Catalog" (no
# "ServiceNow") so it is OUTSIDE this vocab's .*ServiceNow.* scope; the catalog
# ITEM order form is "<item> | ServiceNow" and IS in scope. `Search catalog` is
# kept for completeness but only enriches when it appears on a ServiceNow-titled page.
#
# Browser-agnostic: window_title scope only (matches ServiceNow in Chrome OR Edge).
app_vocabulary:
  id: "servicenow"
  name: "ServiceNow (ITSM)"
  version: 2

  scope:
    window_title_regex: ".*ServiceNow.*"

  screens:
    - id: "incident"
      name: "Incident form"
      window_title_regex: ".*Incident.*ServiceNow.*"
    - id: "change"
      name: "Change Request form"
      window_title_regex: ".*Change Request.*ServiceNow.*"
    - id: "request"
      name: "Request (REQ) record"
      window_title_regex: ".*\\| Request \\|.*ServiceNow.*"
    - id: "catalog-item"
      name: "Catalog item order form"
    - id: "list"
      name: "List view"
    - id: "platform"
      name: "Platform (nav / generic form chrome)"

  interactions:
    # === Incident form (probed 2026-05-30; fields refreshed 2026-05-31) =======
