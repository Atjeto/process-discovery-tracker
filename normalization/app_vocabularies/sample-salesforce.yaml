# Sample App Vocabulary for Salesforce (ADR-0002).
#
# This is a worked example. Copy it, rename the file, and edit the
# entries to match your tenant. Each app you care about gets its own
# *.yaml in this folder.
#
# Bootstrap a starter from a real captured session:
#   python normalize.py <session_folder> --bootstrap-vocab-out salesforce.yaml --vocab-id salesforce --vocab-name "Salesforce"
#
# Or use the Vocabularies tab in the viewer to edit this file as a form.

app_vocabulary:
  id: "salesforce"
  name: "Salesforce"
  version: 1
  owner: "tooling-lead@team"

  # Scope: only interactions matching both fields enter this vocab's
  # domain. Other apps in the session are ignored.
  scope:
    process_name: "chrome.exe"
    window_title_regex: ".*Salesforce.*"

  # Named screens. Useful for grouping interactions in reports and for
  # writing tighter signatures (a name like "Save" appears on many
  # screens; window_title_regex inside the signature disambiguates).
  screens:
    - id: "account-search"
      name: "Account Search"
      window_title_regex: ".*Search Accounts.*"
    - id: "account-detail"
      name: "Account Detail"
      window_title_regex: ".*Account: .+ Salesforce.*"
    - id: "case-detail"
      name: "Case Detail"
      window_title_regex: ".*Case #\\d+.*"
    - id: "opportunity-detail"
      name: "Opportunity Detail"
      window_title_regex: ".*Opportunity:.*"
    - id: "lead-detail"
      name: "Lead Detail"
      window_title_regex: ".*Lead:.*"

  # Per-interaction annotations. Each signature's fields are AND-ed.
  # Most-specific match wins (most non-empty signature fields). Ties
  # broken by first-defined.
  interactions:

    # --- Navigation / search -----------------------------------------
    - signature:
        control_type: "Edit"
        automation_id: "globalSearchInput"
      name: "Type into global search"
      screen: "account-search"

    - signature:
        control_type: "Button"
        automation_id: "globalSearchSubmit"
      name: "Run global search"

    - signature:
        control_type: "Edit"
        automation_id: "searchInput"
      name: "Enter customer search query"
      screen: "account-search"

    - signature:
        control_type: "Button"
        name: "Search"
        window_title_regex: ".*Salesforce.*Search.*"
      name: "Run customer search"
      screen: "account-search"

    - signature:
        control_type: "Hyperlink"
        window_title_regex: ".*Account: .+"
      name: "Open account from search result"

    # --- Account / contact CRUD --------------------------------------
    - signature:
        control_type: "Button"
        name: "New"
      name: "Create new record"

    - signature:
        control_type: "Edit"
        automation_id: "accountName"
      name: "Enter account name"
      screen: "account-detail"

    - signature:
        control_type: "Edit"
        automation_id: "accountPhone"
      name: "Enter phone number"

    - signature:
        control_type: "Edit"
        automation_id: "accountEmail"
      name: "Enter email address"

    - signature:
        control_type: "ComboBox"
        automation_id: "accountIndustry"
      name: "Select industry"

    - signature:
        control_type: "Button"
        name: "Save"
        window_title_regex: ".*Account.*"
      name: "Save account record"

    - signature:
        control_type: "Button"
        name: "Save & New"
      name: "Save and start new record"
      flags:
        automation_candidate: true

    - signature:
        control_type: "Button"
        name: "Edit"
      name: "Edit current record"

    # --- Cases / support --------------------------------------------
    - signature:
        control_type: "Button"
        name: "New Case"
      name: "Create new case"

    - signature:
        control_type: "Edit"
        automation_id: "caseSubject"
      name: "Enter case subject"
      screen: "case-detail"

    - signature:
        control_type: "ComboBox"
        automation_id: "casePriority"
      name: "Set case priority"

    - signature:
        control_type: "Button"
        name: "Close Case"
      name: "Close case"
      flags:
        automation_candidate: true

    - signature:
        control_type: "Button"
        name: "Escalate"
      name: "Escalate case"
      flags:
        exception_path: true

    # --- Opportunities ----------------------------------------------
    - signature:
        control_type: "Button"
        name: "Convert"
      name: "Convert lead to opportunity"
      screen: "lead-detail"

    - signature:
        control_type: "ComboBox"
        automation_id: "opportunityStage"
      name: "Update opportunity stage"

    # --- Activity logging -------------------------------------------
    - signature:
        control_type: "Button"
        name: "Log a Call"
      name: "Log a call"
      flags:
        automation_candidate: true

    - signature:
        control_type: "Button"
        name: "New Task"
      name: "Create follow-up task"

    - signature:
        control_type: "Button"
        name: "Send Email"
      name: "Send email from record"
      flags:
        automation_candidate: true

    # --- Reports / list views (often "waste" - dashboards open in
    #     parallel and analysts hop between them) ---------------------
    - signature:
        control_type: "TabItem"
        name: "Reports"
      name: "Switch to Reports tab"

    - signature:
        control_type: "Hyperlink"
        name: "Refresh"
        window_title_regex: ".*Dashboard.*"
      name: "Refresh dashboard"
      flags:
        waste: true

    # --- Generic catch-alls (lower-specificity fallbacks) ------------
    # These match anything Salesforce-scoped that didn't hit a
    # higher-specificity signature above. Use sparingly; specific is
    # always better.
    - signature:
        control_type: "Button"
        name: "Cancel"
      name: "Cancel current action"
