# Google Chrome (browser chrome) App Vocabulary — ADR-0002.
#
# Names the BROWSER's own controls (address bar, tabs, navigation), not any web
# app's content — so it complements, never competes with, a site vocab like
# salesforce.yaml. The address bar's name "Address and search bar" and class
# OmniboxViewViews are confirmed against the live recorder (scripts/real-capture-
# report.md); the nav-button names are Chrome's real UIA accessibility names.
# Signatures use control_type + name/class_name, NEVER CSS. Chromium automation_ids
# are volatile "view_NNNN" view IDs, so the omnibox keys on its stable class_name.
# Microsoft Edge has its own vocab (edge.yaml); both share the OmniboxViewViews omnibox.
app_vocabulary:
  id: "chrome"
  name: "Google Chrome (browser)"
  version: 2

  scope:
    process_name: "chrome.exe"

  interactions:
    - signature: { control_type: "Edit", class_name: "OmniboxViewViews" }
      name: "Address bar"
    - signature: { control_type: "Button", name: "Reload this page" }
      name: "Reload the page"
    - signature: { control_type: "Button", name: "Back" }
      name: "Navigate back"
    - signature: { control_type: "Button", name: "Forward" }
      name: "Navigate forward"
    - signature: { control_type: "Button", name: "New Tab" }
      name: "Open a new tab"
    - signature: { control_type: "Button", name: "Bookmark this tab" }
      name: "Bookmark the page"
