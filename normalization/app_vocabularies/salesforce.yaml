# Salesforce (Lightning) App Vocabulary — ADR-0002.
#
# REAL-VALUE mapping (§11d). Probed live from a Salesforce Developer Edition org —
# the Lightning "New Account" create form — in Chrome on 2026-05-30 (see
# docs/REAL-VALUE-TESTING.md).
#
# KEY DIFFERENCE from Office/ServiceNow: Salesforce Lightning AUTO-GENERATES its
# automation_ids per render (input-378, combobox-button-411, ...) — they are
# VOLATILE and must NOT appear in signatures. Signatures key on control_type +
# the accessible NAME (the field label, which is stable), the same way chrome.yaml
# does. framework_id "Chrome"; class "slds-input" / "slds-combobox__input…".
# Browser-agnostic (window_title scope only).
#
# Covers the New Account form; New Case / New Contact follow the same label-based
# pattern — probe and add per object as the rollout needs them.
app_vocabulary:
  id: "salesforce"
  name: "Salesforce (Lightning)"
  version: 2

  scope:
    window_title_regex: ".*Salesforce.*"

  screens:
    - id: "account-new"
      name: "New Account"
      window_title_regex: ".*New Account.*Salesforce.*"

  interactions:
    # --- New Account fields (label-keyed; auto-generated aids are volatile) ---
    - signature: { control_type: "Edit", name: "Account Name" }
      name: "Account name"
      screen: "account-new"
    - signature: { control_type: "Edit", name: "Phone" }
      name: "Phone"
      screen: "account-new"
    - signature: { control_type: "Edit", name: "Website" }
      name: "Website"
      screen: "account-new"
    - signature: { control_type: "Edit", name: "Account Number" }
      name: "Account number"
      screen: "account-new"
    - signature: { control_type: "ComboBox", name: "Type" }
      name: "Type"
      screen: "account-new"
    - signature: { control_type: "ComboBox", name: "Industry" }
      name: "Industry"
      screen: "account-new"
    - signature: { control_type: "ComboBox", name: "Rating" }
      name: "Rating"
      screen: "account-new"
    - signature: { control_type: "ComboBox", name: "Parent Account" }
      name: "Parent account"
      screen: "account-new"
    - signature: { control_type: "ComboBox", name: "Billing Country" }
      name: "Billing country"
      screen: "account-new"
    - signature: { control_type: "Edit", name: "Billing Street" }
      name: "Billing street"
      screen: "account-new"
    - signature: { control_type: "Edit", name: "Billing City" }
      name: "Billing city"
      screen: "account-new"
    - signature: { control_type: "ComboBox", name: "Billing State/Province" }
      name: "Billing state/province"
      screen: "account-new"
    - signature: { control_type: "Edit", name: "Billing Zip/Postal Code" }
      name: "Billing ZIP/postal code"
      screen: "account-new"
    - signature: { control_type: "Edit", name: "Description" }
      name: "Description"
      screen: "account-new"

    # --- Actions -----------------------------------------------------
    - signature: { control_type: "Button", name: "Save" }
      name: "Save record"
      screen: "account-new"
      flags:
        automation_candidate: true
    - signature: { control_type: "Button", name: "Save & New" }
      name: "Save and new"
      screen: "account-new"
    - signature: { control_type: "Button", name: "Cancel" }
      name: "Cancel"
      screen: "account-new"
