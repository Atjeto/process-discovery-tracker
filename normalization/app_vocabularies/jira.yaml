# Jira (Cloud) App Vocabulary — ADR-0002.
#
# ⚠️ DRAFT — DOC-DERIVED SKELETON, NOT LIVE-PROBED (§11d fallback).
# ---------------------------------------------------------------------------
# Unlike servicenow.yaml / salesforce.yaml (probed live this cycle), the Jira
# create-issue form was NOT reachable for a live UIA probe when this was authored
# (no logged-in Jira tab open on the dev box). The field set + visible labels
# below are DERIVED FROM ATLASSIAN DOCS (the Global Issue Create form), not from a
# UIA walk. Every `signature.name` is the *visible field label*, used here as the
# ASSUMED accessible UIA `name` — the same label-keyed approach salesforce.yaml
# proved works for a React app. THE LIVE PROBE MUST CONFIRM THESE before this
# loses its draft flag. Run the 2-minute probe per
# docs/To-Do/JIRA-ZENDESK-PROBE-CHEATSHEET.md (foreground-watcher
# _pdt_verify/probe_web_uia.ps1), then replace the PROVISIONAL signatures with the
# harvested control_type/name (and add automation_id ONLY if probing shows a
# STABLE one — Jira is React, so expect auto-generated volatile ids that must NOT
# go in a signature, exactly like Salesforce).
#
# WHY THIS IS SAFE TO SHIP AS A DRAFT: signatures match on exact equality, so a
# wrong label guess simply fails to match (under-coverage) — it can never MIS-name
# a control. That is the opposite of the invented-automation_id fiction §11d
# removed. Worst case here is "named nothing," never "named wrong."
#
# PROBE-UNCERTAIN items are tagged `# PROBE:` inline:
#   - control_type for the picker fields (Project / Issue type / Priority /
#     Assignee / Reporter / Labels): React Select widgets usually surface as
#     ComboBox, but a button-trigger picker would be Button.
#   - Description is a ProseMirror rich-text editor — may surface as Edit,
#     Document, or Group rather than Edit.
#   - the window_title scope: Jira Cloud tabs end "… - Jira"; the create modal is
#     an OVERLAY that does NOT change the tab title, so screen-by-title is unset.
#
# Browser-agnostic: window_title scope only (no process_name), so it matches Jira
# in Chrome OR Edge and complements the browser-chrome vocabs.
app_vocabulary:
  id: "jira"
  name: "Jira (Cloud) — DRAFT doc-derived"
  version: 1

  scope:
    window_title_regex: ".*Jira.*"

  screens:
    # PROBE: the Global Issue Create dialog is a modal overlay and does NOT change
    # the browser tab title, so there is no reliable title to scope it by. Left
    # without a window_title_regex on purpose; confirm/adjust after probing.
    - id: "create-issue"
      name: "Create issue"

  interactions:
    # --- Create-issue fields (PROVISIONAL label-keyed; confirm via probe) ----
    - signature: { control_type: "ComboBox", name: "Project" }   # PROBE: picker — ComboBox or Button?
      name: "Project"
      screen: "create-issue"
    - signature: { control_type: "ComboBox", name: "Issue type" }   # PROBE: label may be "Issue Type" (classic)
      name: "Issue type"
      screen: "create-issue"
    - signature: { control_type: "Edit", name: "Summary" }
      name: "Summary"
      screen: "create-issue"
    - signature: { control_type: "Edit", name: "Description" }   # PROBE: ProseMirror — may be Document/Group
      name: "Description"
      screen: "create-issue"
    - signature: { control_type: "ComboBox", name: "Assignee" }   # PROBE: picker control_type
      name: "Assignee"
      screen: "create-issue"
    - signature: { control_type: "ComboBox", name: "Reporter" }   # PROBE: picker control_type
      name: "Reporter"
      screen: "create-issue"
    - signature: { control_type: "ComboBox", name: "Priority" }
      name: "Priority"
      screen: "create-issue"
    - signature: { control_type: "ComboBox", name: "Labels" }   # PROBE: multi-select token input
      name: "Labels"
      screen: "create-issue"
    - signature: { control_type: "ComboBox", name: "Components" }   # PROBE: company-managed projects only
      name: "Components"
      screen: "create-issue"
    - signature: { control_type: "Edit", name: "Due date" }   # PROBE: date picker — Edit or Button?
      name: "Due date"
      screen: "create-issue"

    # --- Actions (PROVISIONAL) ---------------------------------------------
    - signature: { control_type: "Button", name: "Create" }
      name: "Create issue"
      screen: "create-issue"
      flags:
        automation_candidate: true
    - signature: { control_type: "CheckBox", name: "Create another" }   # PROBE: label/control_type
      name: "Create another"
      screen: "create-issue"
    - signature: { control_type: "Button", name: "Cancel" }
      name: "Cancel"
      screen: "create-issue"
