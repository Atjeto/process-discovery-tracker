# Sample canonical process with ANCHOR-BASED case detection (ADR-0012).
#
# Use this shape when the captured process is a stream of repeating
# tickets / cases driven by typing into a known field (a serial number,
# a customer search box, an order id). The pipeline anchors a case on
# every fire of that field, then stamps every following interaction to
# the most-recent case until the next anchor fires.
#
# Anchor-based detection runs INSTEAD of marker pairs -- the worker
# doesn't have to remember to press Start / End for each ticket.
#
# Two anchor matchers exist; pick whichever fits the app.
#
# 1. RECOGNISED (portable): keys on a documented platform signature
#    from `shared/recognition-patterns.json` (ADR-0011). Categories
#    include "search", "grid_cell", "rich_text_editor", and others
#    -- the *same* anchor recognises a search box across many apps.
#
# 2. EXPLICIT FIELD RULE (bespoke): targets one app's specific UIA
#    field by automation_id / name / value. Use when the field has
#    no recognised category or you need to disambiguate two
#    recognised fields in the same window.
#
# Both can be combined -- they are AND-ed when both are present.
#
# Bootstrap a fresh template from a real captured session via:
#   python normalize.py <session_folder> --bootstrap-vocab-out ...
# (the vocab bootstrapper is separate -- this file is hand-authored).

canonical_process:
  id: "sample-anchor-onboarding"
  name: "Sample anchor-based onboarding"
  version: 1
  owners: ["tooling-lead@team"]

  # === ANCHOR ===
  case_anchor:
    # Option A -- recognised (portable). Uncomment and pick one or
    # more categories from shared/recognition-patterns.json.
    #
    # recognized: "search"
    #
    # Option B -- explicit field rule (this example). The anchor
    # fires whenever the analyst types into a UIA Edit whose
    # `name` is exactly "Customer name:".
    field: "name"
    equals: "Customer name:"

    # The value typed into the anchor field is what names the case.
    # For a serial-number search box this would be the serial; for a
    # customer-name field it's the customer name.
    case_label_from: "value"

    # Degenerate-case guards (defaults shown). A focus-without-type
    # fires the anchor with an empty value, which is suppressed by
    # an empty-label guard -- but if a worker types one character
    # and abandons the case, these two thresholds drop the sliver.
    min_case_interactions: 2
    min_case_duration_ms: 1000

  # === STEPS ===
  # The same shape as a marker-based template -- anchor mode only
  # changes HOW cases are detected, not how steps are matched.
  steps:
    - step_id: "open-record"
      name: "Open customer record"
      match:
        - process_name: "chrome.exe"
          interaction:
            control_type: "Edit"
            name: { equals: "Customer name:" }

    - step_id: "fill-contact"
      name: "Fill contact info"
      match:
        - process_name: "chrome.exe"
          interaction:
            control_type: "Edit"
            name: { matches: "Telephone|E-mail" }

    - step_id: "submit"
      name: "Submit"
      match:
        - process_name: "chrome.exe"
          interaction:
            control_type: "Button"
            name: { equals: "Submit" }

  # Phases group steps into milestones (optional, drives PDD + phase BPMN).
  phases:
    - phase_id: "validate"
      name: "Validate customer"
      step_ids: ["open-record"]
    - phase_id: "provision"
      name: "Provision"
      step_ids: ["fill-contact", "submit"]
