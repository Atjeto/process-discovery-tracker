canonical_process:
  id: "customer-onboarding-v3"
  name: "Customer Onboarding"
  version: 7
  owners: ["tooling-lead@team"]

  phases:
    - phase_id: "validate"
      name: "Validate customer"
      step_ids: ["check-crm", "credit-check", "kyc-verify"]
    - phase_id: "onboard"
      name: "Provision account"
      step_ids: ["create-account", "send-welcome"]

  steps:
    - step_id: "check-crm"
      name: "Check existing customer record"
      description: "Search the CRM by customer email or name."
      match:
        - process_name: "chrome.exe"
          window_title_regex: ".*Salesforce.*Search.*"
          interaction:
            control_type: "Edit"
            automation_id: "searchInput"
          end_when:
            interaction:
              control_type: "Button"
              name: "Search"

    - step_id: "credit-check"
      name: "Run credit check"
      description: "Trigger the third-party credit-check workflow."
      match:
        - process_name: "chrome.exe"
          window_title_regex: ".*CreditBureau.*"

    - step_id: "kyc-verify"
      name: "KYC verification"
      description: "Verify identity documents."
      match:
        - process_name: "chrome.exe"
          window_title_regex: ".*KYC.*"

    - step_id: "create-account"
      name: "Create account record"
      match:
        - process_name: "chrome.exe"
          window_title_regex: ".*Salesforce.*Account.*New.*"

    - step_id: "send-welcome"
      name: "Send welcome email"
      match:
        - process_name: "OUTLOOK.EXE"
          window_title_regex: ".*Welcome.*"
