# Example canonical process template — ATM Ticket Handling
#
# This is a worked example of the v0.13 template format. Field values
# (automation_ids, class names, window titles) are placeholders from one
# engagement's applications. An analyst authoring a real template identifies
# them from their own capture.
#
# Fact-find (real ATM capture, ADR-0009) CONFIRMED for this engagement:
#   - the case-anchor automation_id "txtsr" is real and captured with a value
#     (the serial field "SrNo" is an alternate/additional candidate);
#   - the AG-Grid cell class "ag-cell-edit-input" is real (classify-ticket);
#   - TAMBA is Chrome-hosted, the call-management system is Edge-hosted, so the
#     match rules stay browser-agnostic (no process_name constraint).
# Still to verify against your own values/titles: the name/title/value rules
# below (check-call-mgmt, check-contract, write-resolution, update-status).

canonical_process:
  id: "atm-ticket-handling"
  name: "ATM Ticket Handling"
  version: 1

  case_anchor:
    # Two ways to name the case-anchor field (ADR-0012 #7):
    #  (a) a RECOGNISED signature (ADR-0011) -- the portable form, keyed on a
    #      documented platform category instead of a per-app automation_id:
    #          recognized: "search"                  # e.g. an Office 365 search box
    #      or compose recognition with a label pattern for a generic text field:
    #          recognized: ["text_entry", "search"]
    #          field: "name"
    #          matches: "(?i)serial|ticket|case"
    #  (b) an explicit field rule -- the per-engagement fallback used here,
    #      because the ATM serial box `txtsr` is a plain Edit with no
    #      distinctive recognised signature.
    field: "automation_id"
    equals: "txtsr"
    case_label_from: "value"
    # Active-case stamping (NEXT-SESSION §2, option C): the case_id is stable
    # per serial, so re-searching the same serial RESUMES its case instead of
    # opening a new one (this is what stops a couple of serials inflating into
    # a dozen "cases"). The degenerate-case guard drops accidental anchor fires
    # -- a case below EITHER threshold is discarded.
    min_case_interactions: 2
    min_case_duration_ms: 1000

  phases:
    - phase_id: "investigation"
      name: "Investigation"
      step_ids: ["investigate-serial", "check-call-mgmt", "check-contract"]
    - phase_id: "resolution"
      name: "Resolution"
      step_ids: ["write-resolution", "classify-ticket", "update-status"]

  steps:
    - step_id: "investigate-serial"
      name: "Investigate serial"
      description: "Look up the serial in SNFI and cross-reference in TAMBA."
      match:
        - interaction: { automation_id: "txtsr" }
      boundary: "until_next_step"

    - step_id: "check-call-mgmt"
      name: "Check call management"
      match:
        - interaction: { name: { contains: "Load Task#" } }
      boundary: "until_app_change"

    - step_id: "check-contract"
      name: "Check contract coverage"
      match:
        - window_title_regex: ".*Time.*Material.*team.*"
      boundary: "until_app_change"

    - step_id: "write-resolution"
      name: "Write resolution"
      match:
        - window_title_regex: ".*TAMBA.*"
          interaction: { value: { starts_with: "**Resolution**" } }
      boundary: "single"

    - step_id: "classify-ticket"
      name: "Classify ticket"
      # Fact-find: AG-Grid cells are identityless -- no per-cell automation_id
      # or name; every cell is the same "ag-cell-edit-input" Edit. Per-field
      # granularity is NOT recoverable from the capture, so this necessarily
      # matches the whole grid as ONE coarse step -- until_field_change cannot
      # sub-divide it (there is no detectable field change).
      match:
        - window_title_regex: ".*TAMBA.*"
          interaction: { class_name: "ag-cell-edit-input" }
      boundary: "until_field_change"

    - step_id: "update-status"
      name: "Update status fields"
      match:
        - interaction: { value: { equals: "No FLM" } }
        - interaction: { value: { equals: "No related tickets in 14 days" } }
      boundary: "single"
